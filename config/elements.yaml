# Ethics Element Set for RepGrid v2
# Theory-neutral selection: 15 discrete ethical situations
# No MFT pre-categorisation — structure should emerge from the model, not the researcher
#
# Design rationale:
# - Short, discrete phrases (3-8 words)
# - 2 low-stakes elements (E05, E06) for dynamic range
# - 1 visceral/sanctity trigger (E08) for width
# - 12 moderate-to-high-stakes spanning interpersonal/institutional/bioethical/political
# - 455 possible triads — sufficient for 8-10 constructs per grid

elements:
